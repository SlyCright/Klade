# TECHNICAL DEBT:
#
# This workflow embeds deployment logic directly in the application repository, using
# Windows-specific paths and commands. This violates the principle that deployment should be
# infrastructure-agnostic. If we changed hosting to Linux or cloud, this entire workflow would
# need replacement.
#
# We accept this debt because the current constrains to Windows Server bare-metal deployment. For
# a single-maintainer hobby project, the simplicity of keeping deployment logic here outweighs
# the benefits of separation.

# DEPLOYMENT SETUP NOTES:
#  If a self-hosted runner needs re-setup, see docs/github-runner-setup.md:
# - Use --unattended flag to avoid hanging prompts
# - Adjust rights for GitHub's runner so it can stop KladeApp service

name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle (Production)
        run: ./gradlew clean build -Pproduction

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: klade-app
          path: build/libs/web-app-*.jar
          retention-days: 5

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: klade-app
          path: C:\klade\new

      - name: Stop existing service
        run: |
          Write-Host "Stopping KladeApp service..."
          Stop-Service -Name KladeApp -Force -ErrorAction SilentlyContinue
          
          # Wait for service to actually stop (max 90 seconds)
          $timeout = 90
          $elapsed = 0
          while ((Get-Service -Name KladeApp).Status -ne 'Stopped' -and $elapsed -lt $timeout) {
          Write-Host "Waiting for KladeApp service to stop... ($elapsed/$timeout seconds)"
          Start-Sleep -Seconds 5
          $elapsed += 5
          }
          
          if ((Get-Service -Name KladeApp).Status -ne 'Stopped') {
          Write-Error "KladeApp service failed to stop within $timeout seconds"
          # Show any remaining Java processes
          Get-Process java -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime
          throw "Service stop timeout"
          }
          
          # Additional buffer for file handle release
          Write-Host "Service stopped. Waiting 10 seconds for file handles to release..."
          Start-Sleep -Seconds 10

      - name: Backup current JAR
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          if (Test-Path "C:\klade\klade-app.jar") {
            Move-Item -Path "C:\klade\klade-app.jar" -Destination "C:\klade\backups\klade-app_$timestamp.jar" -Force
          }

      - name: Deploy new JAR
        run: |
          Move-Item -Path "C:\klade\new\web-app-*.jar" -Destination "C:\klade\klade-app.jar" -Force
          Remove-Item -Path "C:\klade\new" -Recurse -Force

      - name: Start service
        run: Start-Service -Name KladeApp

      - name: Verify deployment
        run: |
          Start-Sleep -Seconds 100
          $status = Invoke-WebRequest -Uri "http://localhost:8081/actuator/health" -UseBasicParsing
          if ($status.StatusCode -ne 200) { exit 1 }