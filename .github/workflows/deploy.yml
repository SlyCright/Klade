# TECHNICAL DEBT:
#
# This workflow embeds deployment logic directly in the application repository, using
# Windows-specific paths and commands. This violates the principle that deployment should be
# infrastructure-agnostic. If we changed hosting to Linux or cloud, this entire workflow would
# need replacement.
#
# We accept this debt because the current constrains to Windows Server bare-metal deployment. For
# a single-maintainer hobby project, the simplicity of keeping deployment logic here outweighs
# the benefits of separation.

# DEPLOYMENT SETUP NOTES:
#  If a self-hosted runner needs re-setup, see docs/github-runner-setup.md:
# - Use --unattended flag to avoid hanging prompts
# - Adjust rights for GitHub's runner so it can stop KladeApp service

name: Deploy

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [deploy-main]  # Triggered by stage/simulation
  workflow_dispatch:

jobs:
  # Fetch latest stage client before building
  fetch-stage-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # Download the latest stage artifact from stage repo
      - name: Get latest stage client
        run: |
          # Download from the most recent successful run
          gh run download --repo SlyCright/klade-stage \
            --name stage-dist-latest \
            --dir src/main/resources/static/stage/ \
            || echo "No stage artifact found, using existing files"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Upload stage assets for build job
        uses: actions/upload-artifact@v4
        with:
          name: stage-client-assets
          path: src/main/resources/static/stage/
          retention-days: 1

  # Build the main application
  build:
    needs: fetch-stage-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download stage client assets
        uses: actions/download-artifact@v4
        with:
          name: stage-client-assets
          path: src/main/resources/static/stage/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Force refresh to get latest simulation snapshot
      - name: Build with Gradle (Production)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew clean build -Pproduction --refresh-dependencies

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: klade-app
          path: build/libs/web-app-*.jar
          retention-days: 5

  # Deploy to Windows Server
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: klade-app
          path: C:\klade\new

      - name: Stop existing service
        run: |
          Stop-Service -Name KladeApp -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 15

      - name: Backup current JAR
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          if (Test-Path "C:\klade\klade-app.jar") {
            Move-Item -Path "C:\klade\klade-app.jar" -Destination "C:\klade\backups\klade-app_$timestamp.jar" -Force
          }

      - name: Deploy new JAR
        run: |
          Move-Item -Path "C:\klade\new\web-app-*.jar" -Destination "C:\klade\klade-app.jar" -Force
          Remove-Item -Path "C:\klade\new" -Recurse -Force

      - name: Start service
        run: Start-Service -Name KladeApp

      - name: Verify deployment
        run: |
          Start-Sleep -Seconds 60
          $status = Invoke-WebRequest -Uri "http://localhost:8081/actuator/health" -UseBasicParsing
          if ($status.StatusCode -ne 200) { exit 1 }