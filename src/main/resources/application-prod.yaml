# Production configuration - overrides application.yaml
server:
  port: 8081
  forward-headers-strategy: framework  # Trust headers from IIS reverse proxy
  tomcat:
    remoteip:
      protocol-header: x-forwarded-proto  # IIS sends this header
      internal-proxies: (localhost|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|::1)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/klade}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop # It's temporary for prod until the database stabilizes
    show-sql: false

# Security dependencies switched off temporarily since the MVP wouldn't be multiplayer
#  security:
#    user:
#      name: ${SPRING_SECURITY_USER_NAME:admin}
#      password: ${SPRING_SECURITY_USER_PASSWORD}

vaadin:
  productionMode: true
  launch-browser: false

management:
  endpoints:
    web:
      exposure:
        include: health,info  # Expose health check for monitoring
  endpoint:
    health:
      show-details: when-authorized