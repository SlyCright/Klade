simulation:
  # Common project simulation settings (loaded by SimulationProperties).
  # All simulation-tuning values belong here — do not hardcode them in the code.

  # Simulation-wide management settings
  species-total: 3
  specimens-per-species: 10
  sleep-per-update-millis: 100

  # Genetics / evolutionary parameters
  # (consumed by the mutator pipeline in site.klade.webapp.evolution)
  evolution:

    # Initial hyper-gene value for generation 0 genomes (R_max, domain: (0, 1]).
    # Controls the starting mutation intensity before self-adaptation kicks in.
    initial-hyper-gene: 1.0

    # Extra probability of forcing a DELETION structural mutation on top of the flat
    # mutation-type distribution. With 6 structural mutation types:
    #   P(DELETION) = 1/6 + deletion-bias * 5/6   (0.05 -> ~20.8% instead of ~16.7%)
    # which lets genomes shed unnecessary genes over long runs. Domain: [0.0, 1.0].
    mutation:
      deletion-bias: 0.05

    # Ontogenesis condition-expression limits (see site.klade.simulation.condition).
    #
    # These values are bound at runtime via ConditionParserConfig, which threads them into
    # the GWT-shared simulation library using ConditionParser.configureLimits(). The parser
    # lives in the simulation library which has no Spring, so a static setter is used instead
    # of field injection.
    condition:
      # Maximum depth of a condition AST, counting a leaf as depth 1.
      # Enforced by ConditionParser and (later) by structural mutation, which must use this same
      # limit — a tree deeper than this can be built by mutation but cannot be re-parsed.
      # Rejected well below the stack-overflow point: a ~2000-node AND chain already overflows
      # a default JVM stack at toString() time.
      max-tree-depth: 64

      # Maximum parenthesis nesting the parser will recurse through. Parentheses do not add AST
      # depth, so this bounds hand-written pathological input only.
      max-paren-depth: 256

  # Single arena battle settings (used for simulation inside Arena for every competition run)

  # TODO: ArenaSettings immutable (no setters) — Spring may silently ignore YAML.
  #  CHECK: change YAML, restart, GET /api/arena-settings; if unchanged, binding silently fails.

  arena:
    initial-distance: 300.0
    friction-factor: 0.01
    node-size: 18.0
    repulsion-factor: 10.0
    max-ticks: 3000
