simulation:
  # Common project simulation settings (loaded by SimulationProperties).
  # All simulation-tuning values belong here — do not hardcode them in the code.

  # Simulation-wide management settings
  species-total: 3
  specimens-per-species: 10
  sleep-per-update-millis: 100

  # Base mutation chances (will be scaled by mutationFactor in rank-linear reproduction)
  base-meta-gene-mutation-chance: 0.15
  base-morphogen-mutation-chance: 0.15
  base-gene-mutation-chance: 0.15

  # Single arena battle settings (used by EvolutionEngine for every competition run)

  # TODO: ArenaSettings immutable (no setters) — Spring may silently ignore YAML.
  #  CHECK: change YAML, restart, GET /api/arena-settings; if unchanged, binding silently fails.

  arena:
    initial-distance: 300.0
    friction-factor: 0.01
    node-size: 18.0
    repulsion-factor: 10.0
    max-ticks: 3000
